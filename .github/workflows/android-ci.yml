name: Android CI

on:
  push:
    branches: ["main"]
    paths:
      - 'android-app/**'
      - 'build.gradle*'
      - 'gradle/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'android-app/**'
      - 'build.gradle*'
      - 'gradle/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      SDK_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
      ANDROID_PLATFORM: "platforms;android-34"
      ANDROID_BUILD_TOOLS: "build-tools;34.0.0"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x android-app/gradlew

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/android-app/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/android-app/**/build.gradle*') }}
        restore-keys: |
          gradle-cache-${{ runner.os }}-

    - name: Cache Android cmdline-tools
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools
        key: android-cmdline-${{ runner.os }}-${{ hashFiles('.github/workflows/android-ci.yml') }}
        restore-keys: android-cmdline-${{ runner.os }}-

    - name: Install Android cmdline-tools & SDK
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        mkdir -p "$ANDROID_SDK_ROOT/licenses"

        # Download cmdline-tools if missing
        if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
          echo "Downloading cmdline-tools..."
          wget -q "$SDK_TOOLS_URL" -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmd
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmd/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
        fi

        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

        # Install SDK packages safely (NO BROKEN PIPE)
        echo "Installing SDK packages..."
        sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
          "platform-tools" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" <<< "y"

        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    - name: Accept Android SDK licenses
      run: |
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
        sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses <<< "y" >/dev/null 2>&1 || true

    - name: Ensure source directories exist
      run: |
        mkdir -p android-app/app/src/main/kotlin
        mkdir -p android-app/app/src/debug/java
        mkdir -p android-app/app/src/debug/kotlin

    - name: Build APK
      working-directory: ./android-app
      shell: bash
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      run: |
        set -euo pipefail
        mkdir -p build-artifacts

        attempt=1
        max_attempts=3
        exit_code=0

        while [ $attempt -le $max_attempts ]; do
          echo "Gradle build attempt $attempt/$max_attempts"
          ./gradlew assembleDebug --stacktrace --warning-mode=all 2>&1 | tee build-artifacts/build.log
          exit_code=${PIPESTATUS[0]}

          if [ "$exit_code" -eq 0 ]; then
            echo "Build succeeded!"
            break
          fi

          echo "Build failed — retrying..."
          attempt=$((attempt+1))
          sleep 8
        done

        if [ "$exit_code" -ne 0 ]; then
          echo "Build failed after retries."
          exit $exit_code
        fi

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android-app/build-artifacts/build.log

    - name: Verify APK exists
      run: |
        apk="android-app/app/build/outputs/apk/debug/app-debug.apk"
        if [ ! -f "$apk" ]; then
          echo "APK missing!"
          ls -R android-app/app/build || true
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android-app/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Issue on Failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const repo = context.repo;
          let content = "Build failed for commit " + context.sha + "\\n\\n";

          if (fs.existsSync('android-app/build-artifacts/build.log')) {
            const full = fs.readFileSync('android-app/build-artifacts/build.log','utf8');
            content += "```\n" + full.split('\n').slice(0,400).join('\n') + "\n```";
          } else {
            content += "No log found.";
          }

          github.rest.issues.create({
            owner: repo.owner,
            repo: repo.repo,
            title: "CI Failure",
            body: content,
            labels: ['ci','build-failure']
          });
